name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyflakes import-linter==2.15
      - run: python -m pyflakes bot tests scripts
      - run: lint-imports  # the layer order in .importlinter
      - run: python -m unittest discover -s tests -t . -v
