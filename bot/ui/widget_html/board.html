<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{font:15px/1.3 system-ui;color:var(--tg-theme-text-color);background:var(--tg-theme-bg-color);padding:10px;width:100%}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
h1{font-size:17px}h2{font-size:14px;margin:10px 0 4px;color:var(--tg-theme-hint-color)}.h{color:var(--tg-theme-hint-color);font-size:12px}
.row{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:14px}.row span{width:96px;overflow:hidden;white-space:nowrap}
.bar{flex:1;height:14px;border-radius:7px;background:var(--tg-theme-secondary-bg-color);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--tg-theme-button-color);transition:width .8s ease-out}
.row b{width:64px;text-align:right}
#tm{display:flex;height:26px;border-radius:13px;overflow:hidden;font:600 13px system-ui;color:#fff}
#tm div{display:flex;align-items:center;justify-content:center;transition:flex .8s}
#up{margin-top:10px;width:100%;border:0;border-radius:10px;padding:8px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);font:14px system-ui}
</style></head><body>
<div class="top"><h1>📊 Табло</h1><span class="h" id="u"></span></div>
<div id="t"></div><h2>Сезон</h2><div id="s"></div><button id="up">🔄 Обновить</button>
<script>
var W=window.TelegramWidget,D={};
function $(i){return document.getElementById(i)}
function L(t){try{D=JSON.parse(t||W.publicData||'{}')}catch(e){D={}}}
function R(){var s=D.s||[],top=s.length?s[0][1]||1:1,h='';
s.forEach(function(r){h+='<div class="row"><span>'+r[0]+'</span><div class="bar"><i data-w="'+Math.round(100*r[1]/top)+'"></i></div><b>'+r[1]+'</b></div>'});
$('s').innerHTML=h||'<div class="h">Пока пусто</div>';
var t=D.tm;$('t').innerHTML=t?'<h2>Командная неделя</h2><div id="tm"><div style="flex:'+(t[0]+1)+';background:#e53935">'+t[0]+'</div><div style="flex:'+(t[1]+1)+';background:#1e88e5">'+t[1]+'</div></div>':'';
$('u').textContent=D.u?'на '+D.u:'';
setTimeout(function(){var b=document.querySelectorAll('.bar i');for(var i=0;i<b.length;i++)b[i].style.width=b[i].getAttribute('data-w')+'%'},30)}
$('up').addEventListener('click',function(){W.request('u').then(function(a){L(a.result);R()},function(){})});
W.onEvent('publicDataChanged',function(){L();R()});L();R();W.watchPublicData();W.ready();
</script></body></html>
