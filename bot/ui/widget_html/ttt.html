<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{font:15px/1.3 system-ui;color:var(--tg-theme-text-color);background:var(--tg-theme-bg-color);padding:10px;width:100%;text-align:center}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:17px}.h{color:var(--tg-theme-hint-color);font-size:13px}
#who{display:flex;justify-content:space-around;margin:8px 0}#who .on{font-weight:700;color:var(--tg-theme-link-color)}
#b{display:flex;flex-wrap:wrap;gap:6px;width:240px;margin:0 auto}
#b button{width:76px;height:76px;border:0;border-radius:12px;font:700 40px system-ui;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color)}
#b .w{background:#2e7d32;color:#fff}
#st{min-height:20px;margin-top:8px}
</style></head><body>
<div class="top"><h1>❌ Крестики-нолики</h1><span class="h" id="tm"></span></div>
<div id="who"></div><div id="b"></div><div id="st" class="h"></div>
<script>
var W=window.TelegramWidget,D={},busy=0,M={X:'✕',O:'○','.':''};
function $(i){return document.getElementById(i)}
function L(){try{D=JSON.parse(W.chatData||'{}')}catch(e){D={}}}
function T(t){try{W.HapticFeedback.notificationOccurred(t)}catch(e){}}
function say(t){$('st').textContent=t}
var ERR={BUSY:'Секунду…',RATE_LIMITED:'Не так быстро',TIMEOUT:'Бот не ответил',NOT_ALLOWED:'Здесь играть нельзя'};
function Q(s){if(busy)return Promise.resolve({});busy=1;return W.request(s).then(function(a){busy=0;try{return JSON.parse(a.result||'{}')}catch(e){return{}}},function(e){busy=0;say(ERR[e.code]||'Не вышло');return{}})}
function left(){var s=Math.max(0,(D.t||0)-Date.now()/1000|0);return (s/60|0)+':'+('0'+s%60).slice(-2)}
function R(){var z=D.z,n=D.n||['',''],b=D.b||'.........',line=(z&&z.line)||[],h='';$('tm').textContent=z?'':left();
$('who').innerHTML='<span class="'+(!z&&!D.u?'on':'')+'">✕ '+n[0]+'</span><span class="'+(!z&&D.u?'on':'')+'">○ '+n[1]+'</span>';
for(var i=0;i<9;i++)h+='<button data-i="'+i+'"'+(line.indexOf(i)>=0?' class="w"':'')+'>'+M[b[i]]+'</button>';
$('b').innerHTML=h;var c=$('b').children;for(i=0;i<9;i++)c[i].addEventListener('click',tap);
say(z?(z.w?'🏆 '+z.w+' забирает банк':'Ничья, ставки вернулись')+(z.late?' · у '+z.late+' кончилось время':''):'Ход: '+n[D.u||0])}
function tap(e){if(D.z)return;var i=+e.currentTarget.getAttribute('data-i');Q('m'+i).then(function(a){
if(a.s=='ok')T('success');else if(a.s=='done')T('success');else if(a.s=='not_turn')say('Сейчас не твой ход');
else if(a.s=='taken')say('Клетка занята');else if(a.s=='not_player')say('Это не твоя партия');else if(a.s)say('Партия закончилась')})}
W.onEvent('chatDataChanged',function(){L();R()});L();R();
setInterval(function(){if(!D.z)$('tm').textContent=left()},1000);W.ready();
</script></body></html>
